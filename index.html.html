      const parseTime = (tStr) => {
        const [h, m] = tStr.split(':').map(Number);
        return h * 3600 + m * 60;
      };

      const formatTimeDetailed = (totalSec) => {
        if (totalSec <= 0) return "0m 00s qoldi";

        const hours = Math.floor(totalSec / 3600);
        const minutes = Math.floor((totalSec % 3600) / 60);
        const seconds = totalSec % 60;

        const parts = [];
        if (hours > 0) parts.push(`${hours}h`);
        if (minutes > 0 || hours > 0) parts.push(`${minutes}m`);
        parts.push(`${seconds < 10 ? '0' : ''}${seconds}s`);

        return parts.join(' ') + " qoldi";
      };

      const getDynamicTimerStyle = (diffSec) => {
        const maxSec = 3600 * 2;
        const ratio = Math.min(Math.max(diffSec / maxSec, 0), 1);

        const r = Math.round(239 + (99 - 239) * ratio);
        const g = Math.round(68 + (102 - 68) * ratio);
        const b = Math.round(68 + (241 - 68) * ratio);

        return {
          color: `rgb(${r}, ${g}, ${b})`,
          backgroundColor: `rgba(${r}, ${g}, ${b}, 0.12)`,
          borderColor: `rgba(${r}, ${g}, ${b}, 0.25)`
        };
      };

      // KUNLIK TAYMER MANTIQLARI (Har 23:59:59 da yangilanadi)
      const getRowTimerStatus = (row) => {
        const slot = timeSlots.find(s => s.num === row.num);
        if (!slot) return { status: "none", text: "-" };

        const nowSec = currentTime.getHours() * 3600 + currentTime.getMinutes() * 60 + currentTime.getSeconds();

        const endSec = parseTime(slot.end);

          const prevSlot = timeSlots.find(s => s.num === row.num - 1);
          const prevEndSec = prevSlot ? parseTime(prevSlot.end) : null;

          if (nowSec >= startSec && nowSec < endSec) {
            const remSec = endSec - nowSec;
            const m = Math.floor(remSec / 60);
            const s = remSec % 60;
            return {
              status: "active",
              text: `Do ur lesson 📚 (${m}m ${s < 10 ? '0' : ''}${s}s)`
            };
          } 
          else if (prevEndSec && nowSec >= prevEndSec && nowSec < startSec) {
            const breakLeft = startSec - nowSec;
            const m = Math.floor(breakLeft / 60);
            const s = breakLeft % 60;
            return {
              status: "break",
              text: `Tanaffus, damingni ol ☕ (${m}m ${s < 10 ? '0' : ''}${s}s)`
            };
          }
          else if (nowSec < startSec) {
            const diff = startSec - nowSec;
            return {
              status: "upcoming",
              diffSec: diff,
              text: formatTimeDetailed(diff)
            };
          } 
          else {
            return { status: "past", text: "Tugadi" };
          }
        }

          const diffTillMidnight = endOfDaySec - nowSec;

            text: `Bugun tugashiga: ${formatTimeDetailed(diffTillMidnight)}`
          };

                </button>
              );
            })}
          </div>

          {/* Schedule Table (Keng va Ko'rimli Qatorlar bilan) */}
          <div className="glass-card rounded-3xl overflow-hidden border border-slate-800/80 shadow-2xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm text-slate-300">
                <thead className="bg-slate-900/90 border-b border-slate-800/80 text-slate-400 uppercase text-[11px] tracking-wider font-extrabold">
                  <tr>
                    <th className="py-5 px-6 pl-8">#</th>
                    <th className="py-5 px-6">Vaqt</th>
                    <th className="py-5 px-6">Dars nomi</th>
                    <th className="py-5 px-6">O'qituvchi</th>
                    <th className="py-5 px-6">Specialist 🎓</th>
                    <th className="py-5 px-6">Xona</th>
                    <th className="py-5 px-6">Uy Vazifasi 📝</th>
                    <th className="py-5 px-6">Holat / Taymer</th>
                    {isAdmin && <th className="py-5 px-6 text-center pr-8">Amal</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60">
                  {filteredSchedule.map((item) => {
                    const timerStatus = getRowTimerStatus(item);

                    return (
                      <tr 
                        key={item.id} 
                        className={`transition-all duration-200 hover:bg-indigo-500/10 ${
                          timerStatus.status === 'active' ? 'bg-indigo-500/15' : ''
                        }`}
                      >
                        {/* Qator balandligi py-6 qilib oshirildi */}
                        <td className="py-6 px-6 pl-8 font-black text-slate-500 text-base">{item.num}</td>
                        <td className="py-6 px-6 font-mono text-xs font-bold text-slate-400 whitespace-nowrap">{item.time}</td>
                        
                        {editingId === item.id ? (
                          <>
                            <td className="p-3">
                              <input
                                type="text"
                                value={editForm.subject}
                                onChange={(e) => setEditForm({ ...editForm, subject: e.target.value })}
                                className="bg-slate-900/90 border border-indigo-500/60 rounded-xl px-3.5 py-2 text-white w-full focus:outline-none text-xs font-semibold"
                              />
                            </td>
                            <td className="p-3">
                              <input
                                type="text"
                                value={editForm.teacher}
                                onChange={(e) => setEditForm({ ...editForm, teacher: e.target.value })}
                                className="bg-slate-900/90 border border-indigo-500/60 rounded-xl px-3.5 py-2 text-white w-full focus:outline-none text-xs font-semibold"
                              />
                            </td>
                            <td className="p-3">
                              <input
                                type="text"
                                value={editForm.specialist}
                                placeholder="Specialist..."
                                onChange={(e) => setEditForm({ ...editForm, specialist: e.target.value })}
                                className="bg-slate-900/90 border border-purple-500/60 rounded-xl px-3.5 py-2 text-purple-300 w-full focus:outline-none text-xs font-semibold"
                              />
                            </td>
                            <td className="p-3">
                              <input
                                type="text"
                                value={editForm.room}
                                onChange={(e) => setEditForm({ ...editForm, room: e.target.value })}
                                className="bg-slate-900/90 border border-indigo-500/60 rounded-xl px-3.5 py-2 text-white w-20 focus:outline-none text-xs font-semibold"
                              />
                            </td>
                            <td className="p-3">
                              <input
                                type="text"
                                value={editForm.homework}
                                placeholder="Uy vazifasi..."
                                onChange={(e) => setEditForm({ ...editForm, homework: e.target.value })}
                                className="bg-slate-900/90 border border-amber-500/60 rounded-xl px-3.5 py-2 text-amber-300 w-full focus:outline-none text-xs font-semibold"
                              />
                            </td>
                            <td className="py-6 px-6 text-slate-600">-</td>
                            <td className="py-6 px-6 text-center space-x-2 pr-8 whitespace-nowrap">
                              <button
                                onClick={() => saveItem(item.id)}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-md transition"
                              >
                                Saqlash 💾
                              </button>
                              <button
                                onClick={() => setEditingId(null)}
                                className="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-bold transition"
                              >
                                Bekor qilish
                              </button>
                            </td>
                          </>
                        ) : (
                          <>
                            <td className="py-6 px-6 font-extrabold text-white text-base tracking-wide whitespace-nowrap">
                              {item.subject}
                            </td>
                            <td className="py-6 px-6 text-slate-300 font-semibold text-sm whitespace-nowrap">
                              {item.teacher}
                            </td>
                            <td className="py-6 px-6 whitespace-nowrap">
                              <span className="inline-flex items-center gap-1.5 bg-purple-500/10 text-purple-300 px-3.5 py-1.5 rounded-xl text-xs font-extrabold border border-purple-500/25 shadow-sm">
                                🎓 {item.specialist || "General"}
                              </span>
                            </td>
                            <td className="py-6 px-6 whitespace-nowrap">
                              <span className="bg-slate-800/90 text-indigo-400 px-3.5 py-1.5 rounded-xl text-xs font-mono font-bold border border-slate-700/80 shadow-inner">
                                {item.room}
                              </span>
                            </td>
                            <td className="py-6 px-6 max-w-xs">
                              {item.homework ? (
                                <span className="text-amber-300 text-xs font-semibold bg-amber-500/10 px-3.5 py-2 rounded-xl border border-amber-500/20 block truncate shadow-sm" title={item.homework}>
                                  📌 {item.homework}
                                </span>
                              ) : (
                                <span className="text-slate-600 text-xs italic">Vazifa yo'q</span>
                              )}
                            </td>

                            <td className="py-6 px-6 whitespace-nowrap">
                              {timerStatus.status === "active" && (
                                <span className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl text-xs font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 animate-pulse shadow-lg shadow-emerald-500/10">
                                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                                  {timerStatus.text}
                                </span>
                              )}
                              {timerStatus.status === "break" && (
                                <span className="inline-flex items-center gap-2 px-4 py-2 rounded-2xl text-xs font-bold bg-purple-500/15 text-purple-300 border border-purple-500/30 animate-pulse shadow-lg shadow-purple-500/10">
                                  ☕ {timerStatus.text}
                                </span>
                              )}
                              {timerStatus.status === "upcoming" && (
                                <span 
                                  style={getDynamicTimerStyle(timerStatus.diffSec)}
                                  className="inline-flex items-center px-4 py-2 rounded-2xl text-xs font-mono font-bold border transition-colors duration-500 shadow-sm"
                                >
                                  ⏳ {timerStatus.text}
                                </span>
                              )}
                              {timerStatus.status === "past" && (
                                <span className="text-slate-500 text-xs font-bold bg-slate-900/60 px-3.5 py-1.5 rounded-xl border border-slate-800">
                                  ✓ Tugadi
                                </span>
                              )}
                            </td>

                            {isAdmin && (
                              <td className="py-6 px-6 text-center pr-8 whitespace-nowrap">
                                <button
                                  onClick={() => handleEdit(item)}
                                  className="bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-4 py-2 rounded-xl text-xs font-bold transition-all duration-200"
                                >
                                  Tahrirlash ✏️
                                </button>
                              </td>
                            )}
                          </>
                        )}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Admin Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className="glass-card border border-slate-800 rounded-3xl p-8 w-full max-w-md shadow-2xl space-y-6">
                <div className="text-center space-y-2">
                  <div className="w-14 h-14 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl flex items-center justify-center text-indigo-400 mx-auto text-2xl">
                    🔐
                  </div>
                  <h3 className="text-2xl font-black text-white">Admin Rejimiga Kirish</h3>
                  <p className="text-slate-400 text-xs">
                    Dars jadvaliga o'zgartirish kiritish uchun admin parolini kiriting.
                  </p>
                </div>

                <form onSubmit={handleLogin} className="space-y-4">
                  <input
                    type="password"
                    placeholder="Parol kiriting..."
                    value={inputPassword}
                    onChange={(e) => setInputPassword(e.target.value)}
                    className="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl px-5 py-3.5 text-white focus:outline-none focus:border-indigo-500 text-sm font-semibold transition"
                    autoFocus
                  />

                  {passwordError && (
                    <p className="text-rose-400 text-xs font-bold text-center">{passwordError}</p>
                  )}

                  <div className="flex justify-end gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => {
                        setShowModal(false);
                        setPasswordError('');
                        setInputPassword('');
                      }}
                      className="w-1/2 py-3 rounded-2xl text-slate-400 hover:bg-slate-800/80 text-xs font-bold transition"
                    >
                      Bekor qilish
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-90 text-white rounded-2xl text-xs font-bold shadow-lg shadow-indigo-600/30 transition"
                    >
                      Kirish 🔓
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
